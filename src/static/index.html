<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NoteTaker - Your Personal Note Manager</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            color: white;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 30px;
            flex: 1;
        }

        .sidebar {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
            height: fit-content;
        }

        .note-editor {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
        }

        .search-box {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 14px;
            margin-bottom: 20px;
            transition: border-color 0.3s ease;
        }

        .search-box:focus {
            outline: none;
            border-color: #667eea;
        }

        .new-note-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 20px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .new-note-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .notes-list {
            max-height: 500px;
            overflow-y: auto;
        }

        .note-item {
            padding: 15px;
            border: 2px solid transparent;
            border-radius: 10px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #f8f9fa;
        }

        .note-item:hover {
            border-color: #667eea;
            transform: translateX(5px);
        }

        .note-item.active {
            border-color: #667eea;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%);
        }

        .note-title {
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 5px;
            color: #333;
        }

        .note-preview {
            font-size: 14px;
            color: #666;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .note-date {
            font-size: 12px;
            color: #999;
            margin-top: 5px;
        }

        .editor-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .editor-title {
            font-size: 1.5rem;
            color: #333;
        }

        .editor-actions {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .btn-save {
            background: #28a745;
            color: white;
        }

        .btn-save:hover {
            background: #218838;
            transform: translateY(-1px);
        }

        .btn-delete {
            background: #dc3545;
            color: white;
        }

        .btn-delete:hover {
            background: #c82333;
            transform: translateY(-1px);
        }

        .language-select {
            padding: 8px 30px 8px 10px;
            border: 1px solid #e1e5e9;
            border-radius: 8px;
            background: white;
            color: #333;
            font-size: 14px;
            cursor: pointer;
        }

        .btn-translate {
            background: #667eea;
            color: white;
        }

        .btn-translate:hover {
            background: #5369d6;
            transform: translateY(-1px);
        }

        .btn:disabled,
        .language-select:disabled {
            opacity: 0.6;
            cursor: wait;
            transform: none;
        }

        .translation-in-progress .note-item {
            pointer-events: none;
            opacity: 0.55;
        }

        .attachment-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .attachment-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }

        .attachment-item {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 10px;
            background: #f1f3f5;
            border-radius: 6px;
            font-size: 13px;
        }

        .attachment-item button {
            border: none;
            background: transparent;
            color: #dc3545;
            cursor: pointer;
            font-size: 15px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        .form-input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-textarea {
            width: 100%;
            min-height: 300px;
            padding: 15px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 16px;
            font-family: inherit;
            resize: vertical;
            transition: border-color 0.3s ease;
            line-height: 1.6;
        }

        .form-textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        .empty-state h3 {
            font-size: 1.5rem;
            margin-bottom: 10px;
        }

        .empty-state p {
            font-size: 1rem;
            opacity: 0.8;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #f5c6cb;
        }

        .success {
            background: #d4edda;
            color: #155724;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #c3e6cb;
        }

        .auth-panel {
            width: min(440px, 100%);
            margin: 10vh auto 0;
            padding: 30px;
            background: rgba(255, 255, 255, 0.96);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
        }

        .auth-panel h2 {
            margin-bottom: 20px;
            color: #333;
        }

        .auth-form {
            display: grid;
            gap: 12px;
        }

        .auth-form + .auth-form {
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid #e1e5e9;
        }

        .auth-form .btn {
            padding: 11px 16px;
            background: #667eea;
            color: white;
        }

        .user-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #555;
            font-size: 14px;
        }

        .btn-logout {
            background: #6c757d;
            color: white;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            
            .header h1 {
                font-size: 2rem;
            }
            
            .container {
                padding: 15px;
            }
            
            .sidebar, .note-editor {
                padding: 20px;
            }
        }

        /* Custom Scrollbar */
        .notes-list::-webkit-scrollbar {
            width: 6px;
        }

        .notes-list::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 3px;
        }

        .notes-list::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 3px;
        }

        .notes-list::-webkit-scrollbar-thumb:hover {
            background: #5a6fd8;
        }
    </style>
</head>
<body>
    <div class="auth-panel" id="authPanel">
        <h2>Sign in to NoteTaker</h2>
        <div id="authMessage"></div>
        <form class="auth-form" id="loginForm">
            <input class="form-input" id="loginUsername" type="text" placeholder="Username" required>
            <input class="form-input" id="loginPassword" type="password" placeholder="Password" required>
            <button class="btn" type="submit">Sign in</button>
        </form>
        <form class="auth-form" id="registerForm">
            <input class="form-input" id="registerUsername" type="text" placeholder="New username" required>
            <input class="form-input" id="registerEmail" type="email" placeholder="Email" required>
            <input class="form-input" id="registerPassword" type="password" placeholder="Password (8+ characters)" minlength="8" required>
            <button class="btn" type="submit">Create account</button>
        </form>
    </div>

    <div class="container" id="appContainer" style="display: none;">
        <div class="header">
            <h1>📝 NoteTaker</h1>
            <p>Organize your thoughts, capture your ideas</p>
            <div class="user-bar">
                <span id="currentUser"></span>
                <button class="btn btn-logout" id="logoutBtn">Log out</button>
            </div>
        </div>

        <div class="main-content">
            <div class="sidebar">
                <input type="text" class="search-box" id="searchBox" placeholder="🔍 Search notes...">
                <button class="new-note-btn" id="newNoteBtn">✨ New Note</button>
                
                <div class="notes-list" id="notesList">
                    <div class="loading">Loading notes...</div>
                </div>
            </div>

            <div class="note-editor">
                <div class="editor-header">
                    <h2 class="editor-title" id="editorTitle">Select a note to edit</h2>
                    <div class="editor-actions" id="editorActions" style="display: none;">
                        <select class="language-select" id="languageSelect" aria-label="Translation language">
                            <option value="Chinese (simplified)">Chinese (simplified)</option>
                            <option value="Chinese (traditional)">Chinese (traditional)</option>
                            <option value="English">English</option>
                            <option value="Japanese">Japanese</option>
                            <option value="Korean">Korean</option>
                            <option value="Spanish">Spanish</option>
                        </select>
                        <button class="btn btn-translate" id="translateBtn">🌐 Translate</button>
                        <button class="btn btn-save" id="saveBtn">💾 Save</button>
                        <button class="btn btn-delete" id="deleteBtn">🗑️ Delete</button>
                    </div>
                </div>

                <div id="messageArea"></div>

                <div id="editorForm" style="display: none;">
                    <div class="form-group">
                        <label class="form-label" for="noteTitle">Title</label>
                        <input type="text" class="form-input" id="noteTitle" placeholder="Enter note title...">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="noteContent">Content</label>
                        <textarea class="form-textarea" id="noteContent" placeholder="Start writing your note..."></textarea>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="attachmentInput">Attachments</label>
                        <div class="attachment-controls">
                            <input type="file" id="attachmentInput" accept="image/*,.pdf,.doc,.docx,.md,.txt,.xlsx,.zip">
                            <button class="btn" id="attachBtn" type="button">📎 Attach</button>
                        </div>
                        <div class="attachment-list" id="attachmentList"></div>
                    </div>
                </div>

                <div class="empty-state" id="emptyState">
                    <h3>Welcome to NoteTaker!</h3>
                    <p>Select an existing note or create a new one to get started.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        class NoteTaker {
            constructor() {
                this.notes = [];
                this.currentNote = null;
                this.isLoading = false;
                this.isTranslating = false;
                this.user = null;
                this.init();
            }

            async init() {
                this.bindEvents();
                await this.loadSession();
            }

            bindEvents() {
                document.getElementById('loginForm').addEventListener('submit', (event) => this.login(event));
                document.getElementById('registerForm').addEventListener('submit', (event) => this.register(event));
                document.getElementById('logoutBtn').addEventListener('click', () => this.logout());
                document.getElementById('newNoteBtn').addEventListener('click', () => this.createNewNote());
                document.getElementById('translateBtn').addEventListener('click', () => this.translateNote());
                document.getElementById('attachBtn').addEventListener('click', () => this.uploadAttachment());
                document.getElementById('saveBtn').addEventListener('click', () => this.saveNote());
                document.getElementById('deleteBtn').addEventListener('click', () => this.deleteNote());
                document.getElementById('searchBox').addEventListener('input', (e) => this.searchNotes(e.target.value));
                
                // Auto-save on content change (debounced)
                let saveTimeout;
                const autoSave = () => {
                    clearTimeout(saveTimeout);
                    saveTimeout = setTimeout(() => {
                        if (this.currentNote && this.currentNote.id) {
                            this.saveNote(true);
                        }
                    }, 2000);
                };
                
                document.getElementById('noteTitle').addEventListener('input', autoSave);
                document.getElementById('noteContent').addEventListener('input', autoSave);
            }

            async loadSession() {
                try {
                    const response = await fetch('/api/auth/me');
                    if (!response.ok) return this.showAuth();
                    this.user = await response.json();
                    this.showApp();
                    await this.loadNotes();
                } catch (error) {
                    this.showAuthMessage('Cannot connect to the server. Start Flask and refresh this page.');
                }
            }

            showAuth() {
                document.getElementById('authPanel').style.display = 'block';
                document.getElementById('appContainer').style.display = 'none';
            }

            showApp() {
                document.getElementById('authPanel').style.display = 'none';
                document.getElementById('appContainer').style.display = 'flex';
                document.getElementById('currentUser').textContent = `Signed in as ${this.user.username}`;
            }

            showAuthMessage(message, type = 'error') {
                document.getElementById('authMessage').innerHTML = `<div class="${type}">${message}</div>`;
            }

            async login(event) {
                event.preventDefault();
                await this.authenticate('/api/auth/login', {
                    username: document.getElementById('loginUsername').value,
                    password: document.getElementById('loginPassword').value
                });
            }

            async register(event) {
                event.preventDefault();
                await this.authenticate('/api/auth/register', {
                    username: document.getElementById('registerUsername').value,
                    email: document.getElementById('registerEmail').value,
                    password: document.getElementById('registerPassword').value
                });
            }

            async authenticate(endpoint, credentials) {
                try {
                    const response = await fetch(endpoint, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(credentials)
                    });
                    const result = await response.json();
                    if (!response.ok) throw new Error(result.error || 'Authentication failed');
                    this.user = result;
                    this.showApp();
                    await this.loadNotes();
                } catch (error) {
                    this.showAuthMessage(`Authentication error: ${error.message}`);
                }
            }

            async logout() {
                await fetch('/api/auth/logout', { method: 'POST' });
                this.user = null;
                this.notes = [];
                this.currentNote = null;
                this.hideEditor();
                this.showAuth();
            }

            async loadNotes() {
                this.isLoading = true;
                this.showMessage('Loading notes...', 'loading');
                
                try {
                    const response = await fetch('/api/notes');
                    if (!response.ok) throw new Error('Failed to load notes');
                    
                    this.notes = await response.json();
                    this.renderNotesList();
                    this.hideMessage();
                } catch (error) {
                    this.showMessage(`Error loading notes: ${error.message}`, 'error');
                } finally {
                    this.isLoading = false;
                }
            }

            renderNotesList() {
                const notesList = document.getElementById('notesList');
                
                if (this.notes.length === 0) {
                    notesList.innerHTML = '<div class="empty-state"><p>No notes yet. Create your first note!</p></div>';
                    return;
                }

                notesList.innerHTML = this.notes.map(note => `
                    <div class="note-item ${this.currentNote && this.currentNote.id === note.id ? 'active' : ''}" 
                         data-note-id="${note.id}" onclick="noteTaker.selectNote(${note.id})">
                        <div class="note-title">${this.escapeHtml(note.title || 'Untitled')}</div>
                        <div class="note-preview">${this.escapeHtml(note.content || 'No content')}</div>
                        <div class="note-date">${this.formatDate(note.updated_at)}</div>
                    </div>
                `).join('');
            }

            async selectNote(noteId) {
                if (this.isTranslating) return;
                const note = this.notes.find(n => n.id === noteId);
                if (!note) return;

                this.currentNote = note;
                this.showEditor();
                this.renderNotesList(); // Re-render to update active state
                
                document.getElementById('noteTitle').value = note.title || '';
                document.getElementById('noteContent').value = note.content || '';
                document.getElementById('editorTitle').textContent = note.title || 'Untitled Note';
                this.renderAttachments(note.attachments || []);
            }

            createNewNote() {
                this.currentNote = {
                    id: null,
                    title: '',
                    content: '',
                    created_at: new Date().toISOString(),
                    updated_at: new Date().toISOString()
                };
                
                this.showEditor();
                document.getElementById('noteTitle').value = '';
                document.getElementById('noteContent').value = '';
                this.renderAttachments([]);
                document.getElementById('editorTitle').textContent = 'New Note';
                document.getElementById('noteTitle').focus();
                
                // Remove active state from all notes
                document.querySelectorAll('.note-item').forEach(item => {
                    item.classList.remove('active');
                });
            }

            showEditor() {
                document.getElementById('emptyState').style.display = 'none';
                document.getElementById('editorForm').style.display = 'block';
                document.getElementById('editorActions').style.display = 'flex';
            }

            hideEditor() {
                document.getElementById('emptyState').style.display = 'block';
                document.getElementById('editorForm').style.display = 'none';
                document.getElementById('editorActions').style.display = 'none';
                document.getElementById('editorTitle').textContent = 'Select a note to edit';
                this.currentNote = null;
            }

            async saveNote(isAutoSave = false) {
                if (!this.currentNote) return;

                const title = document.getElementById('noteTitle').value.trim();
                const content = document.getElementById('noteContent').value.trim();

                if (!title && !content) {
                    if (!isAutoSave) {
                        this.showMessage('Please enter a title or content', 'error');
                    }
                    return;
                }

                try {
                    const noteData = {
                        title: title || 'Untitled',
                        content: content
                    };

                    let response;
                    if (this.currentNote.id) {
                        // Update existing note
                        response = await fetch(`/api/notes/${this.currentNote.id}`, {
                            method: 'PUT',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(noteData)
                        });
                    } else {
                        // Create new note
                        response = await fetch('/api/notes', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(noteData)
                        });
                    }

                    if (!response.ok) throw new Error('Failed to save note');

                    const savedNote = await response.json();
                    this.currentNote = savedNote;
                    
                    // Update notes list
                    const existingIndex = this.notes.findIndex(n => n.id === savedNote.id);
                    if (existingIndex >= 0) {
                        this.notes[existingIndex] = savedNote;
                    } else {
                        this.notes.unshift(savedNote);
                    }
                    
                    this.renderNotesList();
                    document.getElementById('editorTitle').textContent = savedNote.title;
                    
                    if (!isAutoSave) {
                        this.showMessage('Note saved successfully!', 'success');
                    }
                } catch (error) {
                    this.showMessage(`Error saving note: ${error.message}`, 'error');
                }
            }

            async translateNote() {
                if (!this.currentNote) return;

                const translateButton = document.getElementById('translateBtn');
                const languageSelect = document.getElementById('languageSelect');
                this.isTranslating = true;
                document.querySelector('.main-content').classList.add('translation-in-progress');
                translateButton.disabled = true;
                languageSelect.disabled = true;
                this.showMessage('Translating note...', 'loading');

                try {
                    const response = await fetch('/api/translate', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            title: document.getElementById('noteTitle').value,
                            content: document.getElementById('noteContent').value,
                            target_language: languageSelect.value
                        })
                    });
                    const result = await response.json().catch(() => ({}));
                    if (!response.ok) throw new Error(result.error || 'Translation failed');

                    document.getElementById('noteTitle').value = result.title;
                    document.getElementById('noteContent').value = result.content;
                    document.getElementById('editorTitle').textContent = result.title || 'Untitled Note';
                    this.showMessage('Note translated successfully. Click Save to keep the translation.', 'success');
                } catch (error) {
                    const message = error.message === 'Failed to fetch'
                        ? 'Cannot reach the Flask server. Start it with: python src/main.py'
                        : `Error translating note: ${error.message}`;
                    this.showMessage(message, 'error');
                } finally {
                    this.isTranslating = false;
                    document.querySelector('.main-content').classList.remove('translation-in-progress');
                    translateButton.disabled = false;
                    languageSelect.disabled = false;
                }
            }

            async uploadAttachment() {
                if (!this.currentNote || !this.currentNote.id) {
                    this.showMessage('Save the note before attaching a file.', 'error');
                    return;
                }

                const input = document.getElementById('attachmentInput');
                if (!input.files.length) {
                    this.showMessage('Choose an image or document first.', 'error');
                    return;
                }

                const formData = new FormData();
                formData.append('file', input.files[0]);
                try {
                    const response = await fetch(`/api/notes/${this.currentNote.id}/attachments`, {
                        method: 'POST',
                        body: formData
                    });
                    const result = await response.json();
                    if (!response.ok) throw new Error(result.error || 'Attachment upload failed');
                    this.currentNote.attachments = [...(this.currentNote.attachments || []), result];
                    const noteIndex = this.notes.findIndex(note => note.id === this.currentNote.id);
                    if (noteIndex >= 0) this.notes[noteIndex].attachments = this.currentNote.attachments;
                    this.renderAttachments(this.currentNote.attachments);
                    input.value = '';
                    this.showMessage('Attachment added.', 'success');
                } catch (error) {
                    this.showMessage(`Error attaching file: ${error.message}`, 'error');
                }
            }

            renderAttachments(attachments) {
                const attachmentList = document.getElementById('attachmentList');
                attachmentList.innerHTML = attachments.map(attachment => `
                    <span class="attachment-item">
                        <a href="${attachment.url}" target="_blank" rel="noopener">${this.escapeHtml(attachment.name)}</a>
                        <button type="button" title="Remove attachment" onclick="noteTaker.deleteAttachment(${attachment.id})">&times;</button>
                    </span>
                `).join('');
            }

            async deleteAttachment(attachmentId) {
                try {
                    const response = await fetch(`/api/attachments/${attachmentId}`, { method: 'DELETE' });
                    if (!response.ok) throw new Error('Attachment deletion failed');
                    this.currentNote.attachments = this.currentNote.attachments.filter(
                        attachment => attachment.id !== attachmentId
                    );
                    this.renderAttachments(this.currentNote.attachments);
                } catch (error) {
                    this.showMessage(`Error removing attachment: ${error.message}`, 'error');
                }
            }

            async deleteNote() {
                if (!this.currentNote || !this.currentNote.id) return;

                if (!confirm('Are you sure you want to delete this note?')) return;

                try {
                    const response = await fetch(`/api/notes/${this.currentNote.id}`, {
                        method: 'DELETE'
                    });

                    if (!response.ok) throw new Error('Failed to delete note');

                    // Remove from notes array
                    this.notes = this.notes.filter(n => n.id !== this.currentNote.id);
                    this.renderNotesList();
                    this.hideEditor();
                    this.showMessage('Note deleted successfully!', 'success');
                } catch (error) {
                    this.showMessage(`Error deleting note: ${error.message}`, 'error');
                }
            }

            searchNotes(query) {
                const filteredNotes = query.trim() === '' ? this.notes : 
                    this.notes.filter(note => 
                        (note.title && note.title.toLowerCase().includes(query.toLowerCase())) ||
                        (note.content && note.content.toLowerCase().includes(query.toLowerCase()))
                    );

                const notesList = document.getElementById('notesList');
                if (filteredNotes.length === 0) {
                    notesList.innerHTML = '<div class="empty-state"><p>No notes found matching your search.</p></div>';
                    return;
                }

                notesList.innerHTML = filteredNotes.map(note => `
                    <div class="note-item ${this.currentNote && this.currentNote.id === note.id ? 'active' : ''}" 
                         data-note-id="${note.id}" onclick="noteTaker.selectNote(${note.id})">
                        <div class="note-title">${this.escapeHtml(note.title || 'Untitled')}</div>
                        <div class="note-preview">${this.escapeHtml(note.content || 'No content')}</div>
                        <div class="note-date">${this.formatDate(note.updated_at)}</div>
                    </div>
                `).join('');
            }

            showMessage(message, type) {
                const messageArea = document.getElementById('messageArea');
                messageArea.innerHTML = `<div class="${type}">${message}</div>`;
                
                if (type === 'success') {
                    setTimeout(() => this.hideMessage(), 3000);
                }
            }

            hideMessage() {
                document.getElementById('messageArea').innerHTML = '';
            }

            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            formatDate(dateString) {
                const date = new Date(dateString);
                const now = new Date();
                const diffTime = Math.abs(now - date);
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

                if (diffDays === 1) {
                    return 'Today';
                } else if (diffDays === 2) {
                    return 'Yesterday';
                } else if (diffDays <= 7) {
                    return `${diffDays - 1} days ago`;
                } else {
                    return date.toLocaleDateString();
                }
            }
        }

        // Initialize the app
        const noteTaker = new NoteTaker();
    </script>
</body>
</html>
